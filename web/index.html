<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="ThesisForge: evidence-first public-equity research, valuation, 13F intelligence, and portfolio analysis.">

  <!-- iOS meta tags, icons & full-screen standalone startup splash screens -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ThesisForge">
  <link rel="apple-touch-icon" sizes="180x180" href="brand/thesisforge-apple-touch-icon-180.png?v=20261119">
  <link rel="apple-touch-icon" sizes="192x192" href="brand/thesisforge-black-mark-192.png?v=20261119">
  <link rel="apple-touch-startup-image" media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="brand/ios-splash/splash-750x1334.png?v=20261119">
  <link rel="apple-touch-startup-image" media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="brand/ios-splash/splash-1170x2532.png?v=20261119">
  <link rel="apple-touch-startup-image" media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="brand/ios-splash/splash-1179x2556.png?v=20261119">
  <link rel="apple-touch-startup-image" media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="brand/ios-splash/splash-1290x2796.png?v=20261119">
  <link rel="apple-touch-startup-image" media="screen and (device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="brand/ios-splash/splash-1320x2868.png?v=20261119">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="64x64" href="brand/thesisforge-black-mark-64.png?v=20261119"/>
  <link rel="shortcut icon" href="favicon.ico?v=20261119"/>
  <meta name="theme-color" content="#000000">

  <title>ThesisForge</title>
  <link rel="manifest" href="manifest.json?v=20261119">
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      margin: 0;
      background: #000000;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
    }

    #app-loading-shell {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: grid;
      place-items: center;
      padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      box-sizing: border-box;
      color: #e8f0f5;
      background: #000000;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", sans-serif;
      transition: opacity 180ms ease;
    }

    #app-loading-shell[data-hidden="true"] {
      opacity: 0;
      pointer-events: none;
    }

    .app-loading-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .app-loading-mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      object-fit: contain;
      background: #000000;
      font-size: 22px;
      font-weight: 800;
    }

    .app-loading-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .app-loading-status {
      color: #8ea1af;
      font-size: 12px;
    }

    .app-loading-progress {
      width: 124px;
      height: 2px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(142, 161, 175, 0.18);
    }

    .app-loading-progress::after {
      content: "";
      display: block;
      width: 44%;
      height: 100%;
      border-radius: inherit;
      background: #f5f5f5;
      animation: app-loading-slide 1.1s ease-in-out infinite;
    }

    @keyframes app-loading-slide {
      from { transform: translateX(-115%); }
      to { transform: translateX(275%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .app-loading-progress::after { animation: none; }
    }
  </style>
</head>
<body>
  <div id="app-loading-shell" role="status" aria-live="polite">
    <div class="app-loading-content">
      <img class="app-loading-mark" src="brand/thesisforge-black-mark-192.png?v=20261119" alt="">
      <div class="app-loading-title">ThesisForge</div>
      <div class="app-loading-status">Loading your research workspace…</div>
      <div class="app-loading-progress" aria-hidden="true"></div>
    </div>
  </div>
  <script>
    // Remove legacy Flutter PWA caches once per migration, then keep the
    // current Flutter service worker warm on repeat visits.
    (() => {
      const currentUrl = new URL(window.location.href);
      let storedLang = null;
      try {
        storedLang = window.localStorage.getItem('thesisforge.language.v1');
      } catch (_) {}
      if (!storedLang && document.cookie) {
        const match = document.cookie.match(/(?:^|;\s*)tf_lang=(zh|en)(?:;|$)/i);
        if (match) storedLang = match[1].toLowerCase();
      }
      const queryLang = (currentUrl.searchParams.get('lang') || '').trim().toLowerCase();
      const rawLang = (queryLang || storedLang || '').trim().toLowerCase();
      if (queryLang === 'zh' || queryLang === 'en' || queryLang.startsWith('zh')) {
        const normalized = queryLang.startsWith('zh') ? 'zh' : 'en';
        try { window.localStorage.setItem('thesisforge.language.v1', normalized); } catch (_) {}
        try {
          const domainPart = window.location.hostname.endsWith('thesisforge.tech') ? '; Domain=.thesisforge.tech' : '';
          document.cookie = `tf_lang=${normalized}; Path=/; Max-Age=31536000; SameSite=Lax${domainPart}`;
        } catch (_) {}
      }
      if (rawLang.startsWith('zh')) {
        if (document.documentElement) document.documentElement.lang = 'zh-CN';
        document.title = 'ThesisForge · 投研工作台';
        const statusEl = document.querySelector && document.querySelector('.app-loading-status');
        if (statusEl) statusEl.textContent = '正在载入投研工作台…';
      }
      const authHandoffId = (currentUrl.searchParams.get('auth_handoff') || '').trim();
      if (authHandoffId) {
        const isZh = rawLang.startsWith('zh') || !rawLang;
        const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
        const accessToken = (hashParams.get('access_token') || '').trim();
        const refreshToken = (hashParams.get('refresh_token') || '').trim();
        const authErr =
          hashParams.get('error_description') ||
          currentUrl.searchParams.get('error_description') ||
          hashParams.get('error') ||
          currentUrl.searchParams.get('error') ||
          '';
        try {
          window.history.replaceState({}, document.title, '/?handoff_done=1');
        } catch (_) {}

        const renderHandoffCard = (htmlContent) => {
          document.body.style.background = '#0D0F14';
          document.body.innerHTML = `
            <div style="min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box;background:#0D0F14;color:#F8FAFC;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','PingFang SC',sans-serif;">
              <div style="width:100%;max-width:390px;background:#161B24;border-radius:24px;padding:26px 22px;border:1px solid rgba(255,255,255,0.06);box-shadow:0 24px 60px rgba(0,0,0,0.52);text-align:center;">
                <div style="display:inline-flex;align-items:center;gap:8px;margin-bottom:14px;">
                  <img src="brand/thesisforge-black-mark-192.png" alt="TF" style="width:34px;height:34px;border-radius:9px;" />
                  <span style="font-size:17px;font-weight:800;letter-spacing:-0.3px;">ThesisForge</span>
                </div>
                ${htmlContent}
              </div>
            </div>
          `;
        };

        if (!accessToken || !refreshToken) {
          renderHandoffCard(`
            <div style="color:#FB7185;font-size:15px;font-weight:700;margin-bottom:8px;">
              ${isZh ? '该邮件确认链接已失效或已被使用' : 'Sign-in link expired or already used'}
            </div>
            <div style="color:#94A3B8;font-size:13px;line-height:1.55;">
              ${authErr ? authErr.replace(/[<>&]/g, '') : (isZh ? '请回到桌面 ThesisForge App 重新发送验证码，或直接使用「密码直登」秒登。' : 'Return to the ThesisForge Home Screen App to request a fresh code or sign in with password.')}
            </div>
          `);
          return;
        }

        renderHandoffCard(`
          <div style="color:#34D399;font-size:14px;font-weight:700;">
            ${isZh ? '正在为您生成 App 专属 6 位验证码并自动同步…' : 'Syncing session to your ThesisForge App…'}
          </div>
        `);

        fetch('/api/auth/handoff/complete', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ handoffId: authHandoffId, accessToken, refreshToken })
        })
          .then((r) => r.json().then((j) => ({ ok: r.ok, body: j })))
          .then(({ ok, body }) => {
            if (!ok || !body || !body.ok || !body.pairCode) {
              throw new Error((body && body.message) || 'Handoff failed');
            }
            const rawCode = String(body.pairCode);
            const spaced = rawCode.slice(0, 3) + ' ' + rawCode.slice(3);
            renderHandoffCard(`
              <div style="display:inline-block;padding:5px 12px;border-radius:999px;background:rgba(52,211,153,0.14);color:#34D399;font-size:12px;font-weight:700;margin-bottom:12px;">
                ${isZh ? '✓ 已自动回传至手机桌面 App' : '✓ Synced to Home Screen App'}
              </div>
              <div style="font-size:19px;font-weight:800;margin-bottom:6px;">
                ${isZh ? '请直接切回 ThesisForge App' : 'Switch Back to ThesisForge App'}
              </div>
              <div style="color:#94A3B8;font-size:12.5px;line-height:1.5;margin-bottom:16px;">
                ${isZh ? '从屏幕底部上滑切回桌面黑色 TF 图标，App 将在 1 秒内自动登录；也可在 App 内输入下方 6 位验证码：' : 'Swipe back to the TF icon on your Home Screen for instant auto-login, or enter this 6-digit code:'}
              </div>
              <div id="tf-pair-code-box" style="background:#0D0F14;border:1px solid rgba(52,211,153,0.38);border-radius:16px;padding:16px 12px;margin-bottom:12px;font-size:34px;font-weight:800;letter-spacing:6px;color:#F8FAFC;font-variant-numeric:tabular-nums;">
                ${spaced}
              </div>
              <button id="tf-copy-code-btn" type="button" style="width:100%;height:46px;border:none;border-radius:14px;background:#34D399;color:#052016;font-size:14px;font-weight:800;cursor:pointer;">
                ${isZh ? '复制 6 位验证码 (' + rawCode + ')' : 'Copy 6-Digit Code (' + rawCode + ')'}
              </button>
              <div style="color:#64748B;font-size:11.5px;margin-top:12px;line-height:1.45;">
                ${isZh ? '提示：登录 App 后可在「账户 → 设置直登密码」开启 iPhone 面容 ID 永久免邮件秒登' : 'Tip: Set an App password inside Account tab to enable FaceID instant sign-in'}
              </div>
            `);
            const copyBtn = document.getElementById('tf-copy-code-btn');
            if (copyBtn && navigator.clipboard) {
              copyBtn.addEventListener('click', () => {
                navigator.clipboard.writeText(rawCode).then(() => {
                  copyBtn.textContent = isZh ? '已复制 ✓ 现在切回桌面 TF App' : 'Copied ✓ Switch to TF App';
                }).catch(() => {});
              });
            }
          })
          .catch(() => {
            renderHandoffCard(`
              <div style="color:#FB7185;font-size:15px;font-weight:700;margin-bottom:8px;">
                ${isZh ? '验证同步超时或链接已过期' : 'Verification expired'}
              </div>
              <div style="color:#94A3B8;font-size:13px;line-height:1.55;">
                ${isZh ? '请切回桌面 ThesisForge App 重新点击发送验证码。' : 'Please return to the ThesisForge App and tap Send Code again.'}
              </div>
            `);
          });
        return;
      }

      const requestedView = (
        currentUrl.searchParams.get('view') ||
        currentUrl.searchParams.get('mode') ||
        ''
      ).trim().toLowerCase();
      const isRetiredModuleRoute =
        ['ontology', 'dbmf'].includes(requestedView) ||
        ['/ontology', '/dbmf'].some((prefix) =>
          currentUrl.pathname.toLowerCase() === prefix ||
          currentUrl.pathname.toLowerCase().startsWith(`${prefix}/`),
        );
      const isAuthCallback =
        currentUrl.searchParams.has('code') ||
        currentUrl.searchParams.has('error') ||
        window.location.hash.includes('access_token=');

      if (isRetiredModuleRoute && !isAuthCallback) {
        const discoverUrl = new URL('/', currentUrl);
        discoverUrl.searchParams.set('view', 'discover');
        const language = currentUrl.searchParams.get('lang');
        if (language) discoverUrl.searchParams.set('lang', language);
        window.location.replace(discoverUrl.pathname + discoverUrl.search);
        return;
      }

      const release = 'flutter-cache-migration-v8';
      const migrationKey = `guru-cache-migration:${release}`;
      const loadingShell = document.getElementById('app-loading-shell');
      let loadingShellRemoved = false;
      const removeLoadingShell = () => {
        if (loadingShellRemoved || !loadingShell) return;
        loadingShellRemoved = true;
        loadingShell.dataset.hidden = 'true';
        window.setTimeout(() => loadingShell.remove(), 220);
      };
      window.addEventListener('flutter-first-frame', removeLoadingShell, { once: true });
      const appRootObserver = new MutationObserver(() => {
        if (document.querySelector('flutter-view, flt-glass-pane')) {
          appRootObserver.disconnect();
          window.requestAnimationFrame(() => window.requestAnimationFrame(removeLoadingShell));
        }
      });
      appRootObserver.observe(document.body, { childList: true, subtree: true });
      const loadFlutter = () => {
        const script = document.createElement('script');
        script.src = `flutter_bootstrap.js?v=${release}`;
        script.async = true;
        document.body.appendChild(script);
      };

      const migrationComplete = () => {
        try {
          return window.localStorage.getItem(migrationKey) === 'complete';
        } catch (_) {
          return false;
        }
      };
      const markMigrationComplete = () => {
        try {
          window.localStorage.setItem(migrationKey, 'complete');
        } catch (_) {
          // Storage can be unavailable in privacy-restricted contexts.
        }
      };

      if (
        isAuthCallback ||
        !('serviceWorker' in navigator) ||
        migrationComplete()
      ) {
        loadFlutter();
        return;
      }

      Promise.all([
        navigator.serviceWorker.getRegistrations().then((registrations) =>
          Promise.all(registrations.map((registration) => registration.unregister())),
        ),
        'caches' in window
          ? caches.keys().then((keys) => Promise.all(keys.map((key) => caches.delete(key))))
          : Promise.resolve(),
      ]).then(() => {
        markMigrationComplete();
        if (navigator.serviceWorker.controller) {
          const url = new URL(window.location.href);
          url.searchParams.set('cache-migration', release);
          window.location.replace(url.toString());
          return;
        }
        loadFlutter();
      }).catch(loadFlutter);
    })();
  </script>
</body>
</html>
