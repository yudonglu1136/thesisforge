<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Guru Intelligence by ThesisForge: evidence-first public-equity research, valuation, 13F intelligence, and portfolio analysis.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Guru Intelligence">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Guru Intelligence | ThesisForge</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #09131d;
    }

    #app-loading-shell {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: grid;
      place-items: center;
      color: #e8f0f5;
      background:
        radial-gradient(circle at 50% 42%, rgba(47, 213, 177, 0.09), transparent 32%),
        #09131d;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: opacity 180ms ease;
    }

    #app-loading-shell[data-hidden="true"] {
      opacity: 0;
      pointer-events: none;
    }

    .app-loading-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .app-loading-mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(47, 213, 177, 0.45);
      border-radius: 12px;
      color: #2fd5b1;
      background: rgba(47, 213, 177, 0.09);
      font-size: 22px;
      font-weight: 800;
    }

    .app-loading-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .app-loading-status {
      color: #8ea1af;
      font-size: 12px;
    }

    .app-loading-progress {
      width: 124px;
      height: 2px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(142, 161, 175, 0.18);
    }

    .app-loading-progress::after {
      content: "";
      display: block;
      width: 44%;
      height: 100%;
      border-radius: inherit;
      background: #2fd5b1;
      animation: app-loading-slide 1.1s ease-in-out infinite;
    }

    @keyframes app-loading-slide {
      from { transform: translateX(-115%); }
      to { transform: translateX(275%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .app-loading-progress::after { animation: none; }
    }
  </style>
</head>
<body>
  <div id="app-loading-shell" role="status" aria-live="polite">
    <div class="app-loading-content">
      <div class="app-loading-mark" aria-hidden="true">TF</div>
      <div class="app-loading-title">ThesisForge</div>
      <div class="app-loading-status">Loading your research workspace…</div>
      <div class="app-loading-progress" aria-hidden="true"></div>
    </div>
  </div>
  <script>
    // Remove legacy Flutter PWA caches once per migration, then keep the
    // current Flutter service worker warm on repeat visits.
    (() => {
      const currentUrl = new URL(window.location.href);
      const requestedView = (
        currentUrl.searchParams.get('view') ||
        currentUrl.searchParams.get('mode') ||
        ''
      ).trim().toLowerCase();
      const isRetiredModuleRoute =
        ['ontology', 'dbmf'].includes(requestedView) ||
        ['/ontology', '/dbmf'].some((prefix) =>
          currentUrl.pathname.toLowerCase() === prefix ||
          currentUrl.pathname.toLowerCase().startsWith(`${prefix}/`),
        );
      const isAuthCallback =
        currentUrl.searchParams.has('code') ||
        currentUrl.searchParams.has('error') ||
        window.location.hash.includes('access_token=');

      if (isRetiredModuleRoute && !isAuthCallback) {
        const discoverUrl = new URL('/', currentUrl);
        discoverUrl.searchParams.set('view', 'discover');
        const language = currentUrl.searchParams.get('lang');
        if (language) discoverUrl.searchParams.set('lang', language);
        window.location.replace(discoverUrl.pathname + discoverUrl.search);
        return;
      }

      const release = 'flutter-cache-migration-v2';
      const migrationKey = `guru-cache-migration:${release}`;
      const loadingShell = document.getElementById('app-loading-shell');
      let loadingShellRemoved = false;
      const removeLoadingShell = () => {
        if (loadingShellRemoved || !loadingShell) return;
        loadingShellRemoved = true;
        loadingShell.dataset.hidden = 'true';
        window.setTimeout(() => loadingShell.remove(), 220);
      };
      window.addEventListener('flutter-first-frame', removeLoadingShell, { once: true });
      const appRootObserver = new MutationObserver(() => {
        if (document.querySelector('flutter-view, flt-glass-pane')) {
          appRootObserver.disconnect();
          window.requestAnimationFrame(() => window.requestAnimationFrame(removeLoadingShell));
        }
      });
      appRootObserver.observe(document.body, { childList: true, subtree: true });
      const loadFlutter = () => {
        const script = document.createElement('script');
        script.src = `flutter_bootstrap.js?v=${release}`;
        script.async = true;
        document.body.appendChild(script);
      };

      const migrationComplete = () => {
        try {
          return window.localStorage.getItem(migrationKey) === 'complete';
        } catch (_) {
          return false;
        }
      };
      const markMigrationComplete = () => {
        try {
          window.localStorage.setItem(migrationKey, 'complete');
        } catch (_) {
          // Storage can be unavailable in privacy-restricted contexts.
        }
      };

      if (
        isAuthCallback ||
        !('serviceWorker' in navigator) ||
        migrationComplete()
      ) {
        loadFlutter();
        return;
      }

      Promise.all([
        navigator.serviceWorker.getRegistrations().then((registrations) =>
          Promise.all(registrations.map((registration) => registration.unregister())),
        ),
        'caches' in window
          ? caches.keys().then((keys) => Promise.all(keys.map((key) => caches.delete(key))))
          : Promise.resolve(),
      ]).then(() => {
        markMigrationComplete();
        if (navigator.serviceWorker.controller) {
          const url = new URL(window.location.href);
          url.searchParams.set('cache-migration', release);
          window.location.replace(url.toString());
          return;
        }
        loadFlutter();
      }).catch(loadFlutter);
    })();
  </script>
</body>
</html>
